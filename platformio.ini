[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = pre:tools/embed_web.py
lib_deps =
	homespan/HomeSpan@^2.1.8
	bblanchon/ArduinoJson@7.4.3

[env:lolin_s3_mini]
extends = common
board = lolin_s3_mini
board_build.partitions = partitions.csv

; Production PCB: bare ESP32-S3-WROOM-1-N16R8, 16 MB flash + octal PSRAM.
[env:pcb]
extends = common
board = esp32-s3-devkitc1-n16r8
board_build.partitions = partitions_16mb.csv
build_flags =
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D PIN_RF315_SCK=12
	-D PIN_RF315_MISO=13
	-D PIN_RF315_MOSI=11
	-D PIN_RF315_CS=10
	-D PIN_RF315_GDO0=4
	-D PIN_RF433_SCK=14
	-D PIN_RF433_MISO=16
	-D PIN_RF433_MOSI=15
	-D PIN_RF433_CS=9
	-D PIN_RF433_GDO0=6
	-D PIN_IR_TX=40
	-D PIN_IR_RX=39
	-D PIN_STATUS_LED=48
	-D STATUS_LED_COLOR_ORDER='"GRB"'

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -DNATIVE_BUILD
lib_compat_mode = off
lib_deps =
	bblanchon/ArduinoJson@7.4.3
